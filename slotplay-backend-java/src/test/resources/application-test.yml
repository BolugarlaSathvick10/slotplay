server:
  servlet:
    session:
      cookie:
        name: slotplay.sid
        http-only: true

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

slotplay:
  cors:
    allowed-origin: http://localhost:3000
  session:
    cookie-name: slotplay.sid
    max-age-ms: 604800000
    secret: test-session-secret-for-isolated-unit-tests-only
  storage:
    provider: local
    upload-dir: test-uploads
  mail:
    from: SlotPlay <slotplay@nmart.me>
  resend:
    api-key: ""
